dupe {
plugin org.drftpd.find.master
class Search
method doSEARCH
perms *
limit 5
# When set to false it will only find stuff publicly available, if true it will honor the privpath rules.
# Default: [false]
observe.privpath false
# Search for: d = directories & f = files (comment to search for all)
# Default: [f]
type f
# Only match exact file/dir-name.
# Default: [true]
exact true
help Searches for files and directories using exact name match.
help.specific ${command} <name>
input all
output source
}

find {
plugin org.drftpd.find.master
class Find
method doFIND
perms *
limit.default 5
limit.max 20
# When set to false it will only find stuff publicly available, if true it will honor the privpath rules.
# Default: [false]
observe.privpath false
sendToSlaves =siteop
deleteFromSlaves =siteop
wipe =siteop
nuke =siteop =nuke
# Directory names (case-insensitive regex) never treated as dupes by the -dupe option, "none" disables it.
# Default: [^((cd|dvd|disc|disk)[0-9]+|sample|samples|subs|proof|covers?|extras?)$]
#dupe.exclude ^((cd|dvd|disc|disk)[0-9]+|sample|samples|subs|proof|covers?|extras?)$
# Permission needed to combine -dupe with -wipe, checked on top of the wipe permission.
# Default: [=siteop]
dupewipe =siteop
# Permission needed to combine -dupe with -nuke, checked on top of the nuke permission.
# Default: [=siteop]
dupenuke =siteop
# Copies of a dupe modified less than this many minutes ago (anywhere inside the release, upload in progress) are not acted on, 0 disables it.
# Default: [60]
#dupe.min.age 60
help Searches for files and directories in the filesystem w/ some neat filters and actions.
help.specific ${command} <options> <actions>
help.specific ${command} options [name] - for a list of all registered options, if the name is provided print details of the option
help.specific ${command} actions - for a list of all registered actions
help.specific All options/actions with multiple or space in arguments must be enclosed with ".
help.specific Valid date format: yyyy.MM.dd OR yyyy.MM.dd.HH.mm.ss, Example: 2010.01.29.08.36.33
help.specific For range options min or max can be left empty
help.specific Valid sort fields: parentPath fullPath(default) owner group type nbrOfSlaves lastModified size
help.specific Regex option matches against full path.
help.specific Exact option makes a wildcard query against exact file/dir name.
help.specific Wildcards(* and ?) available but not within the first three chars.
help.specific Options for printf format:
help.specific #f - name
help.specific #p - path
help.specific #h - parent path
help.specific #H - parent name
help.specific #s - size
help.specific #u - user
help.specific #g - group
help.specific #x - slave
help.specific #t - last modified
help.specific Example: !FIND -printf "filename: #f size: #s"
help.specific Multiple options/actions are allowed. If multiple options are given a file/dir must match all options.
help.specific Dupe option: -dupe [oldest|newest] finds releases whose name (case-insensitive) exists more than once among the matches.
help.specific Only release dirs are compared: dirs directly in a section dir, or in a dated dir of a dated section.
help.specific One copy of every dupe is kept (default the oldest = first created), actions only run on the other copies.
help.specific Note: a dir takes the creation time of its oldest file, so a copy remerged from a slave with old file times can look first created.
help.specific Copies with a change anywhere inside them within dupe.min.age minutes are listed as SKIP (active) and never acted on.
help.specific Without an action -dupe is a dry run that only lists the dupes. Use -wipe to remove them (needs the dupewipe permission)
help.specific or -nuke to nuke them (needs the dupenuke permission), other actions than -print and -printf are refused with -dupe.
help.specific -f, -slaves and -nbrofslaves only match files and can not be combined with -dupe.
help.specific Nuked dirs and names matching dupe.exclude are ignored, -limit is the number of dupe groups.
help.specific Example: !FIND -dupe -section MP3 -wipe
input all
output source
}

search {
plugin org.drftpd.find.master
class Search
method doSEARCH
perms *
limit 5
# When set to false it will only find stuff publicly available, if true it will honor the privpath rules.
# Default: [false]
observe.privpath false
# Search for: d = directories & f = files (comment to search for all)
# Default: [d]
type d
# Only match exact file/dir-name
# Default: [false]
exact false
help Searches for files and directories using wildcards.
help.specific ${command} <word> [word ..]
input all
output source
}
